plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.5.1'
    id 'checkstyle'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

String operatingSystem = System.getProperty('os.name').toLowerCase(Locale.ROOT)
String architecture = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
String javaFxPlatform

if (operatingSystem.contains('mac')) {
    javaFxPlatform = architecture.contains('aarch64') || architecture.contains('arm64')
            ? 'mac-aarch64' : 'mac'
} else if (operatingSystem.contains('win')) {
    javaFxPlatform = 'win'
} else {
    javaFxPlatform = 'linux'
}

configurations {
    javafxCurrentNatives
    javafxWinNatives
    javafxLinuxNatives
    javafxMacNatives
    javafxMacAarch64Natives
}

dependencies {
    String jUnitVersion = '5.14.4'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'

    String javaFxVersion = '17.0.7'

    implementation("org.openjfx:javafx-base:${javaFxVersion}")
    implementation("org.openjfx:javafx-controls:${javaFxVersion}")
    implementation("org.openjfx:javafx-fxml:${javaFxVersion}")
    implementation("org.openjfx:javafx-graphics:${javaFxVersion}")

    javafxCurrentNatives("org.openjfx:javafx-graphics:${javaFxVersion}:${javaFxPlatform}")
    javafxWinNatives("org.openjfx:javafx-graphics:${javaFxVersion}:win")
    javafxLinuxNatives("org.openjfx:javafx-graphics:${javaFxVersion}:linux")
    javafxMacNatives("org.openjfx:javafx-graphics:${javaFxVersion}:mac")
    javafxMacAarch64Natives("org.openjfx:javafx-graphics:${javaFxVersion}:mac-aarch64")
}

def nativePlatforms = [
    win: configurations.javafxWinNatives,
    linux: configurations.javafxLinuxNatives,
    mac: configurations.javafxMacNatives,
    'mac-aarch64': configurations.javafxMacAarch64Natives
]

test {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'

        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
}

application {
    mainClass = 'kdb.Launcher'
}

jar {
    // A lean JAR file (i.e., without the dependencies packaged inside) is not needed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveFileName = 'Kdb.jar'

    nativePlatforms.each { platform, configuration ->
        from(configuration.collect { zipTree(it) }) {
            include '*.dll', '*.so', '*.dylib'
            into "kdb/natives/${platform}"
        }
    }
}

run {
    standardInput = System.in
    classpath += configurations.javafxCurrentNatives
}

checkstyle {
    toolVersion = '11.0.0'
}
